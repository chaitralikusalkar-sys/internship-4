<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Practice Assignment</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background:#f4f4f4;
        }

        /* Header */
        .header{
            text-align:center;
            padding:20px;
        }

        .header h1{
            margin:0;
        }

        /* Flex Section */
        .flex-container{
            display:flex;
            justify-content:center;
            gap:20px;
            margin:20px;
        }

        .flex-box{
            width:120px;
            padding:15px;
            background:white;
            text-align:center;
            border:1px solid #ddd;
        }

        /* Grid Section */
        .grid-container{
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            gap:15px;
            margin:20px;
        }

        .grid-box{
            background:orange;
            color:black;
            text-align:center;
            padding:25px;
            font-weight:bold;
        }

        /* Position Section */
        .position-wrapper{
            margin:20px;
        }

        .relative-box{
            background:lightblue;
            padding:15px;
            position:relative;
        }

        .absolute-box{
            position:absolute;
            right:20px;
            top:20px;
            background:red;
            color:white;
            padding:10px;
        }

        .parent{
            position:relative;
            height:120px;
            background:white;
            margin-top:10px;
            padding:10px;
            border:1px solid #ccc;
        }

        .sticky-box{
            position:sticky;
            top:0;
            background:purple;
            color:white;
            padding:10px;
            margin:20px 0;
        }

        .static-box{
            background:white;
            padding:10px;
            border:1px solid #ccc;
        }

        .fixed-box{
            position:fixed;
            bottom:20px;
            right:20px;
            background:green;
            color:white;
            padding:10px;
        }

    </style>
</head>

<body>

    <div class="header">
        <h1>CSS Practice Assignment</h1>
        <p>Learn Flexbox, Grid and Positioning</p>
    </div>

    <!-- Flexbox -->
    <h2 style="text-align:center;">Flexbox Example</h2>
    <div class="flex-container">
        <div class="flex-box">HTML</div>
        <div class="flex-box">CSS</div>
        <div class="flex-box">JavaScript</div>
    </div>

    <!-- Grid -->
    <h2 style="text-align:center;">Grid Layout Example</h2>
    <div class="grid-container">
        <div class="grid-box">1</div>
        <div class="grid-box">2</div>
        <div class="grid-box">3</div>
        <div class="grid-box">4</div>
        <div class="grid-box">5</div>
        <div class="grid-box">6</div>
    </div>

    <!-- Position -->
    <h2 style="text-align:center;">CSS Position Values</h2>

    <div class="position-wrapper">

        <div class="relative-box">
            position: relative
        </div>

        <div class="parent">
            Parent Box
            <div class="absolute-box">position: absolute</div>
        </div>

        <div class="sticky-box">position: sticky</div>

        <div class="static-box">position: static (default)</div>

    </div>

    <div class="fixed-box">position: fixed</div>

</body>
</html>
