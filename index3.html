<!DOCTYPE html>
<html>

<head>
    <title>Navbar With Logo</title>

    <style>
        body {
            margin: 0px;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            background-color: #001F3F;
            overflow: auto;
            padding: 10px 20px;
        }

        /* Logo */
        .logo {
            color: greenyellow;
            font-size: 28px;
            font-weight: bold;
            float: left;
            margin-right: 40px;
            line-height: 50px;
        }

        /* Remove bullets */
        .navbar ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        /* Menu items */
        .navbar li {
            float: right;
        }

        /* Links */
        .navbar a {
            color: greenyellow;
            text-decoration: underline;
            padding: 15px 20px;
            display: block;

        }

        /* Hover effect */
        .navbar a:hover {
            background-color: #FFD700;
            color: black;
        }
    </style>
</head>

<body>

    <!-- Navbar Start -->
    <div class="navbar">

        <!-- Logo -->
        <div class="logo">
            MyLogo
        </div>

        <!-- Menu -->
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </div>
    <!-- Navbar End -->

</body>

</html>
